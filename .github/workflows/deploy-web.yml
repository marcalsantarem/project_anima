# Build Web (Godot) + deploy no Netlify.
# dev  → https://dev--<site>.netlify.app (alias "dev")
# main → https://<site>.netlify.app (produção)
name: Deploy Web

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

# Um deploy por branch de cada vez; um push novo cancela o anterior.
concurrency:
  group: deploy-web-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "4.7.2-stable"
  NETLIFY_CLI_VERSION: "27.16.2"

jobs:
  build:
    name: Testes + export Web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_BIN: ${{ github.workspace }}/.ci/godot/Godot_v4.7.2-stable_linux.x86_64
      TEMPLATES_DIR: /home/runner/.local/share/godot/export_templates/4.7.2.stable
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Cache do Godot e do template Web
        id: godot-cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            .ci/godot
            /home/runner/.local/share/godot/export_templates/4.7.2.stable
          key: godot-${{ env.GODOT_RELEASE }}-linux-web-nothreads-v1

      # Fonte oficial: releases de godotengine/godot-builds, conferidas pelo SHA512-SUMS.txt.
      - name: Baixar Godot e template Web
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}"
          bin_zip="Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          tpz="Godot_v${GODOT_RELEASE}_export_templates.tpz"
          mkdir -p /tmp/godot-dl .ci/godot "$TEMPLATES_DIR"
          cd /tmp/godot-dl
          curl -fsSL --retry 3 -O "$base/SHA512-SUMS.txt"
          curl -fsSL --retry 3 -O "$base/$bin_zip"
          curl -fsSL --retry 3 -O "$base/$tpz"
          grep -E " (\*)?(${bin_zip}|${tpz})$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$bin_zip" -d "$GITHUB_WORKSPACE/.ci/godot"
          # Só o template usado pelo preset (single-threaded, sem extensões).
          unzip -q -j "$tpz" "templates/web_nothreads_release.zip" "templates/version.txt" -d "$TEMPLATES_DIR"
          rm -rf /tmp/godot-dl

      - name: Conferir Godot
        run: |
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version

      - name: Importar o projeto
        run: '"$GODOT_BIN" --headless --path . --import'

      # GUT sai com código != 0 se algum teste falhar; sem testes verdes, não há deploy.
      - name: Testes (GUT)
        run: '"$GODOT_BIN" --headless --path . -s addons/gut/gut_cmdln.gd -gexit'

      - name: Export Web
        run: |
          set -euo pipefail
          mkdir -p build/web
          "$GODOT_BIN" --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
          # Manifesto e ícones do app (T-175): o export não copia extras de web/.
          bash web/copy_pwa.sh build/web
          test -s build/web/manifest.webmanifest
          du -ah build/web | sort -h

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: web-build
          path: build/web
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy Netlify (${{ github.ref_name }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: web-build
          path: build/web

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      # O netlify-cli lê NETLIFY_AUTH_TOKEN e NETLIFY_SITE_ID do ambiente; nada de segredo na linha de comando.
      - name: Deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          DEPLOY_TARGET: ${{ github.ref_name == 'main' && '--prod' || '--alias=dev' }}
        run: |
          set -euo pipefail
          npx --yes "netlify-cli@${NETLIFY_CLI_VERSION}" deploy \
            --dir=build/web \
            --no-build \
            $DEPLOY_TARGET \
            --message "${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
