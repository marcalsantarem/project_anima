<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 128 128">
<defs>
 <linearGradient id="steel" x1="0" x2="1">
  <stop offset="0" stop-color="#5A6B7E"/><stop offset=".22" stop-color="#C9D6E2"/><stop offset=".45" stop-color="#F2F7FB"/>
  <stop offset=".7" stop-color="#93A4B6"/><stop offset="1" stop-color="#3E4D5E"/></linearGradient>
 <linearGradient id="steelTop" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#F4F9FC"/><stop offset="1" stop-color="#9FB0C2"/></linearGradient>
 <radialGradient id="glass" cx=".5" cy=".45" r=".6">
  <stop offset="0" stop-color="#1F8FA8"/><stop offset=".55" stop-color="#06223A"/><stop offset="1" stop-color="#021423"/></radialGradient>
 <radialGradient id="emit" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#E6FFFF"/><stop offset=".35" stop-color="#3FE8F5" stop-opacity=".9"/>
  <stop offset="1" stop-color="#3FE8F5" stop-opacity="0"/></radialGradient>
 <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
  <stop offset="0" stop-color="#3FE8F5" stop-opacity=".45"/><stop offset="1" stop-color="#3FE8F5" stop-opacity="0"/></linearGradient>
 <radialGradient id="floorGlow" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#3FE8F5" stop-opacity=".35"/><stop offset="1" stop-color="#3FE8F5" stop-opacity="0"/></radialGradient>
</defs>
<ellipse cx="64" cy="96" rx="64" ry="22" fill="url(#floorGlow)"/>
<!-- degrau de baixo -->
<path d="M6 80 L6 90 A58 13 0 0 0 122 90 L122 80 Z" fill="url(#steel)" stroke="#03202E" stroke-width="3" stroke-linejoin="round"/>
<path d="M8 86 A56 12 0 0 0 120 86" fill="none" stroke="#3FE8F5" stroke-width="2.5"/>
<ellipse cx="64" cy="80" rx="58" ry="17" fill="url(#steelTop)" stroke="#03202E" stroke-width="3"/>
<!-- luzes do degrau de baixo (cápsulas) -->
<rect x="20" y="90.5" width="8" height="5" rx="2.5" fill="#E6FFFF" stroke="#0B6E86" stroke-width="1.2"/><rect x="60" y="96.5" width="8" height="5" rx="2.5" fill="#E6FFFF" stroke="#0B6E86" stroke-width="1.2"/><rect x="100" y="90.5" width="8" height="5" rx="2.5" fill="#E6FFFF" stroke="#0B6E86" stroke-width="1.2"/>
<!-- degrau de cima -->
<path d="M18 66 L18 76 A46 13 0 0 0 110 76 L110 66 Z" fill="url(#steel)" stroke="#03202E" stroke-width="3" stroke-linejoin="round"/>
<path d="M20 72 A44 12 0 0 0 108 72" fill="none" stroke="#3FE8F5" stroke-width="3"/>
<path d="M20 72 A44 12 0 0 0 108 72" fill="none" stroke="#E6FFFF" stroke-width="1" opacity=".9"/>
<ellipse cx="64" cy="66" rx="46" ry="14" fill="url(#steelTop)" stroke="#03202E" stroke-width="3"/>
<!-- vidro do emissor com anéis holográficos -->
<ellipse cx="64" cy="66" rx="36" ry="10.5" fill="url(#glass)" stroke="#5A6B7E" stroke-width="1.5"/>
<ellipse cx="64" cy="66" rx="29" ry="8.2" fill="none" stroke="#3FE8F5" stroke-width="1.6" opacity=".9"/>
<ellipse cx="64" cy="66" rx="20" ry="5.6" fill="none" stroke="#3FE8F5" stroke-width="1.2" stroke-dasharray="5 3" opacity=".8"/>
<ellipse cx="64" cy="66" rx="16" ry="6" fill="url(#emit)"/>
<!-- feixe de luz até o cristal (fica atrás dele) -->
<path d="M50 66 L56 22 L72 22 L78 66 Z" fill="url(#beam)"/>
<!-- reflexo no aro -->
<path d="M30 59 A40 11 0 0 1 60 53" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity=".85"/>
</svg>