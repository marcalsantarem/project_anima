<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8">
		<!-- Sem zoom; viewport-fit=cover libera env(safe-area-inset-*) no iPhone. -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="theme-color" content="#07090F">
		<meta name="format-detection" content="telephone=no">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
/* Tokens de docs/ui.md §3.1 */
:root {
	--bg-void: #07090F;
	--bg-panel-alt: #1A2236;
	--line: #2A3550;
	--text-primary: #E8EEF8;
	--text-secondary: #8A96B0;
	--accent: #3DF5E0;
	--danger: #F5455C;
}

/* Página travada: sem scroll, zoom, pull-to-refresh, seleção ou menu de toque. */
html, body {
	position: fixed;
	inset: 0;
	width: 100%;
	height: 100%;
	margin: 0;
	padding: 0;
	overflow: hidden;
	overscroll-behavior: none;
	background-color: var(--bg-void);
	color: var(--text-primary);
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	-webkit-text-size-adjust: 100%;
}

#canvas {
	display: block;
	margin: 0;
	padding: 0;
	border: 0;
	touch-action: none;
}

#canvas:focus {
	outline: none;
}

/* Sonda invisível para ler a safe area em px CSS (lida por window.animaGetSafeArea). */
#safe-area-probe {
	position: fixed;
	inset: 0;
	visibility: hidden;
	pointer-events: none;
	padding-top: env(safe-area-inset-top, 0px);
	padding-right: env(safe-area-inset-right, 0px);
	padding-bottom: env(safe-area-inset-bottom, 0px);
	padding-left: env(safe-area-inset-left, 0px);
}

/* Tela de carregamento (Cyber-Mystic Minimal). Fonte do sistema para não baixar nada antes do jogo. */
#status {
	position: fixed;
	inset: 0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 24px;
	padding: env(safe-area-inset-top, 0px) 24px env(safe-area-inset-bottom, 0px);
	background-color: var(--bg-void);
	font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
	visibility: hidden;
	z-index: 1;
}

#status-title {
	margin: 0;
	font-size: 28px;
	font-weight: 700;
	letter-spacing: 0.2em;
	text-transform: uppercase;
}

#status-title span {
	color: var(--accent);
}

#status-progress {
	width: min(60vw, 320px);
	height: 6px;
	border: 1px solid var(--line);
	border-radius: 3px;
	background-color: var(--bg-panel-alt);
	overflow: hidden;
}

#status-progress-fill {
	width: 0%;
	height: 100%;
	background-color: var(--accent);
	box-shadow: 0 0 12px var(--accent);
	transition: width 150ms ease-out;
}

#status-progress.indeterminate #status-progress-fill {
	width: 30%;
	animation: indeterminate 1.2s ease-in-out infinite;
}

@keyframes indeterminate {
	from { transform: translateX(-100%); }
	to { transform: translateX(340%); }
}

#status-label {
	color: var(--text-secondary);
	font-size: 14px;
	letter-spacing: 0.1em;
}

#status-notice {
	display: none;
	max-width: 420px;
	padding: 16px;
	border: 1px solid var(--danger);
	border-radius: 8px;
	color: var(--text-primary);
	font-size: 14px;
	line-height: 1.4;
	text-align: center;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Seu navegador não suporta canvas.
		</canvas>

		<noscript>
			Ative o JavaScript para jogar.
		</noscript>

		<div id="safe-area-probe"></div>

		<div id="status">
			<h1 id="status-title">Project: <span>Anima</span></h1>
			<div id="status-progress" class="indeterminate"><div id="status-progress-fill"></div></div>
			<div id="status-label">Carregando…</div>
			<div id="status-notice"></div>
		</div>

		<script>
// Bloqueio de gestos do Safari: pinça, duplo toque, rolagem e menu de contexto.
(function () {
	const block = (e) => e.preventDefault();
	['gesturestart', 'gesturechange', 'gestureend', 'contextmenu', 'dblclick'].forEach((type) => {
		document.addEventListener(type, block, { passive: false });
	});
	document.addEventListener('touchmove', (e) => {
		if (e.touches.length > 1 || e.target === document.body || e.target.id === 'canvas') {
			e.preventDefault();
		}
	}, { passive: false });
}());

// Safe area em px CSS, para o Godot ler via JavaScriptBridge.eval("animaGetSafeArea()") (docs/ui.md §9).
window.animaGetSafeArea = function () {
	const s = getComputedStyle(document.getElementById('safe-area-probe'));
	return JSON.stringify({
		top: parseFloat(s.paddingTop) || 0,
		right: parseFloat(s.paddingRight) || 0,
		bottom: parseFloat(s.paddingBottom) || 0,
		left: parseFloat(s.paddingLeft) || 0,
		width: window.innerWidth,
		height: window.innerHeight,
	});
};
		</script>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusFill = document.getElementById('status-progress-fill');
	const statusLabel = document.getElementById('status-label');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		const isProgress = mode === 'progress';
		statusProgress.style.display = isProgress ? 'block' : 'none';
		statusLabel.style.display = isProgress ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('Ocorreu um erro desconhecido.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		displayFailureNotice('Seu navegador não tem os recursos necessários para rodar o jogo:\n' + missing.join('\n'));
		return;
	}

	setStatusMode('progress');
	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				statusProgress.classList.remove('indeterminate');
				const pct = Math.min(100, Math.round((current / total) * 100));
				statusFill.style.width = pct + '%';
				statusLabel.textContent = 'Carregando… ' + pct + '%';
			} else {
				statusProgress.classList.add('indeterminate');
			}
		},
	}).then(() => {
		setStatusMode('hidden');
	}, displayFailureNotice);
}());
		</script>
	</body>
</html>
