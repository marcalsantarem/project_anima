	<head>
		<meta charset="utf-8">
		<!-- Sem zoom; viewport-fit=cover libera env(safe-area-inset-*) no iPhone. -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<!-- Preto durante o logo do estúdio; vira #8E72EC quando a splash B aparece. -->
		<meta name="theme-color" content="#000000">
		<meta name="format-detection" content="telephone=no">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
/* Splash B (docs/arte.md §9.3, docs/ui.md §11). Tudo inline: o export Web do Godot não copia arquivos extras. */
:root {
	--bg-top: #8E72EC;
	--bg-mid: #7B5CE0;
	--bg-bottom: #4E3F8F;
	--ink: #3A2A55;
	--track: #5B4A7A;
	--gold: #FFC93D;
	--cream: #F6E9CF;
	--cream-alt: #EEDDBD;
	--ring: #B9A5E8;
	--crystal: #2FE6D2;
	--text: #FFFFFF;
	--danger: #F5455C;
	/* Cor da página = cor da etapa (logo, splash, título, partida), trocada por animaSetPageColor (T-172):
	   o Safari pinta com ela a faixa abaixo do web view. */
	--page-bg: #000000;
	/* Largura do logotipo (W) e unidade da arte (1 u = 1 px do splash_logo_core 560x760). */
	--w: min(86vw, 440px, calc((100vh - 64px) * 0.55));
	--w: min(86vw, 440px, calc((100dvh - 64px) * 0.55));
	--u: calc(var(--w) / 560);
}

/* Página travada: sem scroll, zoom, pull-to-refresh, seleção ou menu de toque. */
/* Altura = área visível (nunca maior: o web view do Safari acaba antes da tela; T-172). */
html, body {
	position: fixed;
	inset: 0;
	width: 100%;
	height: 100%;
	margin: 0;
	padding: 0;
	overflow: hidden;
	overscroll-behavior: none;
	/* Cor da etapa atual (--page-bg); o degradê da splash fica só em #status. */
	background: var(--page-bg);
	color: var(--text);
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	-webkit-text-size-adjust: 100%;
}

/* O Godot (canvas_resize_policy=2) define largura/altura inline; aqui só fixa no canto. */
#canvas {
	position: fixed;
	top: 0;
	left: 0;
	display: block;
	margin: 0;
	padding: 0;
	border: 0;
	touch-action: none;
}

#canvas:focus {
	outline: none;
}

/* Sonda invisível para ler a safe area em px CSS (lida por window.animaGetSafeArea). */
#safe-area-probe {
	position: fixed;
	inset: 0;
	visibility: hidden;
	pointer-events: none;
	padding-top: env(safe-area-inset-top, 0px);
	padding-right: env(safe-area-inset-right, 0px);
	padding-bottom: env(safe-area-inset-bottom, 0px);
	padding-left: env(safe-area-inset-left, 0px);
}

/* Sondas de altura (svh/dvh/lvh; incluem a safe area com viewport-fit=cover). Lidas pelo script
   "Altura da janela" e pelo diagnóstico animaViewportInfo(). */
.vh-probe {
	position: fixed;
	top: 0;
	left: 0;
	width: 1px;
	height: 100vh;
	visibility: hidden;
	pointer-events: none;
}
#probe-svh { height: 100svh; }
#probe-dvh { height: 100dvh; }
#probe-lvh { height: 100lvh; }

/* Tela de carregamento. Fonte do sistema para não baixar nada antes do jogo. */
#status {
	position: fixed;
	inset: 0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	box-sizing: border-box;
	padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
	background: linear-gradient(var(--bg-top), var(--bg-mid) 55%, var(--bg-bottom));
	font-family: ui-rounded, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
	z-index: 1;
	opacity: 1;
	transition: opacity 250ms ease-out;
}

#status.fade {
	opacity: 0;
	pointer-events: none;
}

#status-sparks {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
	z-index: -1;
	pointer-events: none;
}

/* Palco do logotipo: a imagem é fatiada em cristal (flutua), pedestal e título. */
#status-stage {
	position: relative;
	flex: none;
	width: var(--w);
	height: calc(var(--u) * 830);
}

#status-stage > * {
	position: absolute;
}

#status-rings {
	left: calc(var(--u) * -3.5);
	top: calc(var(--u) * 131);
	width: calc(var(--u) * 567);
	height: calc(var(--u) * 429);
}

#status-glow {
	left: calc(var(--u) * 70);
	top: calc(var(--u) * -6);
	width: calc(var(--u) * 420);
	height: calc(var(--u) * 420);
	border-radius: 50%;
	background: radial-gradient(closest-side, rgba(47, 230, 210, 0.45), rgba(47, 230, 210, 0.16) 50%, rgba(47, 230, 210, 0));
	animation: glow 2.4s ease-in-out infinite alternate;
}

/* Disco de xadrez no chão, com sombra chapada embaixo. */
#status-disc-shadow,
#status-disc {
	left: calc(var(--u) * 104);
	width: calc(var(--u) * 352);
	height: calc(var(--u) * 130);
	border-radius: 50%;
	box-sizing: border-box;
}

#status-disc-shadow {
	top: calc(var(--u) * 435);
	background: var(--ink);
	transform: scaleX(1.02);
}

#status-disc {
	top: calc(var(--u) * 421);
	border: calc(var(--u) * 4.4) solid var(--ink);
	background: repeating-conic-gradient(var(--cream-alt) 0 25%, var(--cream) 0 50%) 50% 50% / calc(var(--u) * 70) calc(var(--u) * 70);
}

#status-disc::after {
	content: '';
	position: absolute;
	left: 12%;
	right: 12%;
	top: 15%;
	bottom: 15%;
	border: calc(var(--u) * 4.4) solid var(--ring);
	border-radius: 50%;
}

.logo-slice {
	left: 0;
	width: var(--w);
	background-image: var(--logo);
	background-repeat: no-repeat;
	background-size: var(--w) auto;
}

#status-crystal {
	top: 0;
	height: calc(var(--u) * 322);
	background-position: 0 0;
	animation: float 2.4s ease-in-out infinite alternate;
}

#status-pedestal {
	top: calc(var(--u) * 322);
	height: calc(var(--u) * 178);
	background-position: 0 calc(var(--u) * -322);
}

/* Sombra do cristal no topo do pedestal: encolhe quando ele sobe. */
#status-crystal-shadow {
	left: calc(var(--u) * 236);
	top: calc(var(--u) * 368);
	width: calc(var(--u) * 88);
	height: calc(var(--u) * 20);
	border-radius: 50%;
	background: rgba(21, 103, 94, 0.28);
	animation: shadow 2.4s ease-in-out infinite alternate;
}

#status-wordmark {
	top: calc(var(--u) * 570);
	height: calc(var(--u) * 260);
	background-position: 0 calc(var(--u) * -500);
}

/* Reserva sem WebP: título em texto. */
#status-title {
	display: none;
	left: 0;
	right: 0;
	top: calc(var(--u) * 600);
	margin: 0;
	text-align: center;
	font-size: calc(var(--u) * 110);
	font-weight: 900;
	line-height: 1;
	color: var(--gold);
	text-shadow: 0 calc(var(--u) * 8) 0 var(--ink);
}

#status-title small {
	display: block;
	margin-bottom: calc(var(--u) * 16);
	font-size: calc(var(--u) * 36);
	letter-spacing: 0.15em;
	color: var(--text);
}

.no-webp .logo-slice,
.no-webp #status-crystal-shadow {
	display: none;
}

.no-webp #status-title {
	display: block;
}

@keyframes float {
	from { transform: translateY(0); }
	to { transform: translateY(calc(var(--u) * -12)); }
}

@keyframes shadow {
	from { transform: scale(1); opacity: 1; }
	to { transform: scale(0.8); opacity: 0.7; }
}

@keyframes glow {
	from { opacity: 0.85; }
	to { opacity: 1; }
}

/* Barra em pílula: trilho roxo-escuro com contorno, preenchimento dourado com brilho. */
#status-progress {
	position: relative;
	flex: none;
	box-sizing: border-box;
	width: calc(var(--u) * 440);
	height: calc(var(--u) * 40);
	min-height: 18px;
	margin-top: calc(var(--u) * 60);
	padding: calc(var(--u) * 3);
	border: calc(var(--u) * 5) solid var(--ink);
	border-radius: 999px;
	background: var(--track);
	box-shadow: 0 calc(var(--u) * 7) 0 var(--ink);
	overflow: hidden;
}

#status-progress-fill {
	position: relative;
	width: 0%;
	height: 100%;
	border-radius: 999px;
	background: var(--gold);
	transition: width 150ms ease-out;
}

#status-progress-fill::after {
	content: '';
	position: absolute;
	left: calc(var(--u) * 8);
	right: calc(var(--u) * 8);
	top: 12%;
	height: 26%;
	border-radius: 999px;
	background: rgba(255, 255, 255, 0.45);
}

#status-progress.indeterminate #status-progress-fill {
	width: 30%;
	animation: indeterminate 1.2s ease-in-out infinite;
}

@keyframes indeterminate {
	from { transform: translateX(-100%); }
	to { transform: translateX(340%); }
}

#status-label {
	flex: none;
	margin-top: calc(var(--u) * 34);
	font-size: max(15px, calc(var(--u) * 28));
	font-weight: 800;
	letter-spacing: 0.02em;
	text-shadow: 0 2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink),
		1.5px 1.5px 0 var(--ink), -1.5px 1.5px 0 var(--ink), 1.5px -1.5px 0 var(--ink), -1.5px -1.5px 0 var(--ink);
}

/* Aviso de erro / sem WebGL 2: painel no estilo do jogo. */
#status-notice {
	display: none;
	flex: none;
	box-sizing: border-box;
	max-width: min(100%, 440px);
	margin-top: calc(var(--u) * 40);
	padding: 16px 20px;
	border: 4px solid var(--ink);
	border-radius: 20px;
	background: var(--track);
	box-shadow: 0 6px 0 var(--ink), inset 0 0 0 2px var(--danger);
	font-size: 15px;
	font-weight: 600;
	line-height: 1.45;
	text-align: center;
}

/* Logo do estúdio (T-170, decisão 44): preto puro por cima da splash B, ~1,5 s. */
#brand {
	position: fixed;
	inset: 0;
	display: flex;
	justify-content: center;
	align-items: center;
	box-sizing: border-box;
	padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
	background: #000;
	z-index: 2;
	transition: opacity 250ms ease-in;
}

#brand img {
	display: block;
	width: min(60vw, 420px, 60vh);
	height: auto;
	opacity: 0;
	transition: opacity 200ms ease-out;
}

#brand.show img {
	opacity: 1;
}

#brand.fade {
	opacity: 0;
	pointer-events: none;
}

@media (prefers-reduced-motion: reduce) {
	#brand,
	#brand img {
		transition: none;
	}
	#status-crystal,
	#status-crystal-shadow,
	#status-glow {
		animation: none;
	}
	#status-progress.indeterminate #status-progress-fill {
		animation-duration: 3s;
	}
	#status {
		transition: none;
	}
}

		<script>
// Cor da página e do theme-color juntos (T-172): o Safari pinta a faixa abaixo do web view (zona do
// indicador de início) com o fundo da página. Etapas: logo #000, splash #4E3F8F (base do degradê), título
// #4E3F8F, partida #5A4A9A (bandeja), resultado #7C6BC9. O Godot chama via ScreenKit.set_page_color().
window.animaSetPageColor = function (color) {
	document.documentElement.style.setProperty('--page-bg', color);
	document.documentElement.style.backgroundColor = color;
	document.body.style.backgroundColor = color;
	const meta = document.querySelector('meta[name="theme-color"]');
	if (meta) {
		meta.setAttribute('content', color);
	}
};

// Logo do estúdio (T-170): fade-in 200 ms, ~1 s parado, fade-out 250 ms. Não atrasa o engine,
// que começa a carregar em paralelo. animaBrand.whenDone(cb) roda cb quando o logo sai (ou já saiu);
// animaBrand.stop() corta o logo na hora (erro).
window.animaBrand = (function () {
	const el = document.getElementById('brand');
	const img = document.getElementById('brand-logo');
	const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
	const FADE_IN = 200, HOLD = 1000, FADE_OUT = 250;
	const queue = [];
	let active = true;
	function end(instant) {
		if (!active) {
			return;
		}
		active = false;
		clearTimeout(timer);
		window.animaSetPageColor('#4E3F8F');
		if (instant || still) {
			el.remove();
		} else {
			el.classList.add('fade');
			setTimeout(() => el.remove(), FADE_OUT + 50);
		}
		queue.splice(0).forEach((cb) => cb());
	}
	const timer = setTimeout(() => end(false), (still ? 0 : FADE_IN) + HOLD);
	if (img.complete && img.naturalWidth === 0) {
		end(true);
	} else {
		img.addEventListener('error', () => end(true));
		requestAnimationFrame(() => el.classList.add('show'));
	}
	return {
		whenDone: (cb) => (active ? queue.push(cb) : cb()),
		stop: () => end(true),
	};
}());

// Logotipo: fatias usam a mesma imagem; sem WebP, cai no título em texto.
(function () {
	const img = document.getElementById('status-logo-src');
	const root = document.documentElement;
	document.getElementById('status').style.setProperty('--logo', 'url("' + img.src + '")');
	const fail = () => root.classList.add('no-webp');
	if (img.complete && img.naturalWidth === 0) {
		fail();
	} else {
		img.addEventListener('error', fail);
	}
}());

// Bloqueio de gestos do Safari: pinça, duplo toque, rolagem e menu de contexto.
(function () {
	const block = (e) => e.preventDefault();
	['gesturestart', 'gesturechange', 'gestureend', 'contextmenu', 'dblclick'].forEach((type) => {
		document.addEventListener(type, block, { passive: false });
	});
	document.addEventListener('touchmove', (e) => {
		if (e.touches.length > 1 || e.target === document.body || e.target.id === 'canvas') {
			e.preventDefault();
		}
	}, { passive: false });
}());

// Altura da janela para o Godot (T-170, T-172; docs/ui.md §9.1). O Godot dimensiona o canvas por
// window.innerHeight. A altura é a da ÁREA VISÍVEL: o menor entre innerHeight e visualViewport.height
// (sem zoom). Nunca lvh nem screen.height: no Safari do iPhone o web view acaba antes da tela (log do dono:
// 768 de 812) e a faixa de baixo é do navegador. Sondas svh/dvh/lvh ficam só para o diagnóstico.
// Simulação para capturas (docs/debug.md): ?simih=768 limita o innerHeight nativo; ?simsafe=t,r,b,l fixa a
// safe area em px CSS.
(function () {
	const params = new URLSearchParams(location.search);
	const simIh = parseFloat(params.get('simih')) || 0;
	const simSafe = (params.get('simsafe') || '').split(',').map(parseFloat);
	if (simSafe.length === 4 && simSafe.every((v) => v >= 0)) {
		const st = document.getElementById('safe-area-probe').style;
		['top', 'right', 'bottom', 'left'].forEach((side, i) => st.setProperty('padding-' + side, simSafe[i] + 'px'));
	}
	const desc = Object.getOwnPropertyDescriptor(window, 'innerHeight')
		|| Object.getOwnPropertyDescriptor(Window.prototype, 'innerHeight');
	const canHook = !!(desc && desc.get && desc.configurable);
	const nativeHeight = () => {
		const h = canHook ? desc.get.call(window) : window.innerHeight;
		return simIh > 0 ? Math.min(h, simIh) : h;
	};
	// Altura da tela na orientação atual (o iOS não troca screen.width/height ao girar).
	const screenHeight = () => {
		const portrait = window.matchMedia ? window.matchMedia('(orientation: portrait)').matches
			: window.innerWidth <= nativeHeight();
		return portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
	};
	const appHeight = () => {
		const h = nativeHeight();
		const vv = window.visualViewport;
		if (vv && vv.height > 0 && Math.abs(vv.scale - 1) < 0.01 && vv.height < h - 1) {
			return Math.round(vv.height);
		}
		return h;
	};
	window.animaNativeInnerHeight = nativeHeight;
	window.animaScreenHeight = screenHeight;
	if (canHook) {
		try {
			Object.defineProperty(window, 'innerHeight', { configurable: true, get: appHeight });
		} catch (e) {
			// Sem override: segue com a altura nativa.
		}
	}
	// A barra do Safari pode mudar o visualViewport sem 'resize' na janela: avisa o Godot.
	let last = appHeight();
	const sync = () => {
		const h = appHeight();
		if (h !== last) {
			last = h;
			window.dispatchEvent(new Event('resize'));
		}
	};
	if (window.visualViewport) {
		window.visualViewport.addEventListener('resize', sync);
	}
	window.addEventListener('orientationchange', () => setTimeout(sync, 250));
}());

// Safe area em px CSS, para o Godot ler via JavaScriptBridge.eval("animaGetSafeArea()") (docs/ui.md §9).
// covers_bottom: o canvas chega à borda inferior da tela (bottom ≥ altura da tela − 1). Sem isso, o Godot
// zera a inset inferior (a faixa fora do canvas já é a zona do indicador de início).
window.animaGetSafeArea = function () {
	const s = getComputedStyle(document.getElementById('safe-area-probe'));
	const canvas = document.getElementById('canvas');
	const r = canvas ? canvas.getBoundingClientRect() : null;
	const bottom = r && r.height > 0 ? r.bottom : window.innerHeight;
	return JSON.stringify({
		top: parseFloat(s.paddingTop) || 0,
		right: parseFloat(s.paddingRight) || 0,
		bottom: parseFloat(s.paddingBottom) || 0,
		left: parseFloat(s.paddingLeft) || 0,
		width: window.innerWidth,
		height: window.innerHeight,
		covers_bottom: bottom >= window.animaScreenHeight() - 1,
	});
};

// Diagnóstico do viewport (T-172): cabeçalho do log e overlay ?debug=1 usam estes mesmos números.
window.animaViewportInfo = function () {
	const vv = window.visualViewport;
	const canvas = document.getElementById('canvas');
	const r = canvas ? canvas.getBoundingClientRect() : { top: 0, bottom: 0, height: 0 };
	const ph = (id) => Math.round(document.getElementById(id).getBoundingClientRect().height);
	const round = (v) => Math.round(v * 10) / 10;
	return JSON.stringify({
		inner: [window.innerWidth, window.animaNativeInnerHeight()],
		app_h: window.innerHeight,
		outer_h: window.outerHeight,
		vv: vv ? [round(vv.width), round(vv.height), round(vv.offsetTop), round(vv.scale)] : null,
		client_h: document.documentElement.clientHeight,
		screen: [screen.width, screen.height],
		svh: ph('probe-svh'),
		dvh: ph('probe-dvh'),
		lvh: ph('probe-lvh'),
		canvas: [round(r.top), round(r.bottom), round(r.height)],
		canvas_h: canvas ? parseFloat(canvas.style.height) || 0 : 0,
		standalone: !!((window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone),
		safe: JSON.parse(window.animaGetSafeArea()),
	});
};
		</script>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusFill = document.getElementById('status-progress-fill');
	const statusLabel = document.getElementById('status-label');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			// Fade curto sobre o primeiro quadro do jogo; remove o overlay ao final.
			initializing = false;
			requestAnimationFrame(() => {
				statusOverlay.classList.add('fade');
				setTimeout(() => statusOverlay.remove(), 300);
			});
			return;
		}
		const isProgress = mode === 'progress';
		statusProgress.style.display = isProgress ? 'block' : 'none';
		statusLabel.style.display = isProgress ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		text.split('\n').forEach((line, i) => {
			if (i > 0) {
				statusNotice.appendChild(document.createElement('br'));
			}
			statusNotice.appendChild(document.createTextNode(line));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		window.animaBrand.stop();
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('Ocorreu um erro desconhecido.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		displayFailureNotice('Seu navegador não tem os recursos necessários para rodar o jogo:\n' + missing.join('\n'));
		return;
	}

	setStatusMode('progress');
	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				statusProgress.classList.remove('indeterminate');
				const pct = Math.min(100, Math.round((current / total) * 100));
				statusFill.style.width = pct + '%';
				statusLabel.textContent = 'Carregando… ' + pct + '%';
			} else {
				statusProgress.classList.add('indeterminate');
			}
		},
	}).then(() => {
		// Jogo pronto antes do logo acabar: o logo termina antes de revelar o título.
		window.animaBrand.whenDone(() => setStatusMode('hidden'));
	}, displayFailureNotice);
}());
		</script>
	</body>
</html>
