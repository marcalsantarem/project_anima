/* Splash tecnológica (T-179, decisão 48; docs/ui.md §11). Arte 768×1376 em arquivo à parte
   (tech_splash_bg.webp, copiado por web/copy_pwa.sh); textos, barra e animações em HTML/CSS por cima. */
:root {
	--bg-deep: #021423; /* base da arte: completa telas mais altas e é a cor da página na splash e no título */
	--cyan: #2FE6F2;
	--cyan-soft: rgba(120, 240, 255, 0.85);
	--text-glow: #E6FFFF;
	--label: #9FF6FF;
	--text: #FFFFFF;
	--danger: #F5455C;
	/* Cor da página = cor da etapa (logo, splash, título, partida), trocada por animaSetPageColor (T-172):
	   o Safari pinta com ela a faixa abaixo do web view. */
	--page-bg: #000000;
	/* Escala da arte (1 u = 1 px da arte 768×1376): cobre a altura; em telas mais estreitas corta as laterais,
	   mas no máximo até a arte ocupar 88% da altura (o resto embaixo é a cor da base). Mesma conta em
	   src/ui/screens/title_screen.gd. */
	--s: min(calc(100vh / 1376), max(calc(100vw / 768), calc(100vh * 0.88 / 1376)));
	--s: min(calc(100dvh / 1376), max(calc(100vw / 768), calc(100dvh * 0.88 / 1376)));
}

/* Página travada: sem scroll, zoom, pull-to-refresh, seleção ou menu de toque. */
/* Altura = área visível (nunca maior: o web view do Safari acaba antes da tela; T-172). */
html, body {
	position: fixed;
	inset: 0;
	width: 100%;
	height: 100%;
	margin: 0;
	padding: 0;
	overflow: hidden;
	overscroll-behavior: none;
	background: var(--page-bg);
	color: var(--text);
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	-webkit-text-size-adjust: 100%;
}

/* O Godot (canvas_resize_policy=2) define largura/altura inline; aqui só fixa no canto. */
#canvas {
	position: fixed;
	top: 0;
	left: 0;
	display: block;
	margin: 0;
	padding: 0;
	border: 0;
	touch-action: none;
}

#canvas:focus {
	outline: none;
}

/* Sonda invisível para ler a safe area em px CSS (lida por window.animaGetSafeArea). */
#safe-area-probe {
	position: fixed;
	inset: 0;
	visibility: hidden;
	pointer-events: none;
	padding-top: env(safe-area-inset-top, 0px);
	padding-right: env(safe-area-inset-right, 0px);
	padding-bottom: env(safe-area-inset-bottom, 0px);
	padding-left: env(safe-area-inset-left, 0px);
}

/* Sondas de altura (svh/dvh/lvh; incluem a safe area com viewport-fit=cover). Lidas pelo script
   "Altura da janela" e pelo diagnóstico animaViewportInfo(). */
.vh-probe {
	position: fixed;
	top: 0;
	left: 0;
	width: 1px;
	height: 100vh;
	visibility: hidden;
	pointer-events: none;
}
#probe-svh { height: 100svh; }
#probe-dvh { height: 100dvh; }
#probe-lvh { height: 100lvh; }

/* Tela de carregamento. Fonte do sistema para não baixar nada antes do jogo. Enquanto a arte não chega,
   fica a cor da base (o logo preto cobre esse tempo). */
#status {
	position: fixed;
	inset: 0;
	overflow: hidden;
	background: var(--bg-deep);
	font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	z-index: 1;
	opacity: 1;
	transition: opacity 250ms ease-out;
}

#status.fade {
	opacity: 0;
	pointer-events: none;
}

/* Quadro da arte, ancorado no topo e centralizado; tudo dentro usa unidades da arte (--s). */
#status-art {
	position: absolute;
	top: 0;
	left: 50%;
	width: calc(var(--s) * 768);
	height: calc(var(--s) * 1376);
	margin-left: calc(var(--s) * -384);
	background: url("tech_splash_bg.webp") 0 0 / 100% 100% no-repeat;
}

#status-art > * {
	position: absolute;
}

/* Bordas suaves: laterais (telas largas) e base (telas mais altas) somem na cor da base, sem faixas. */
#status-art::before,
#status-art::after {
	content: "";
	position: absolute;
	left: 0;
	right: 0;
	pointer-events: none;
}

#status-art::before {
	top: 0;
	bottom: 0;
	background: linear-gradient(90deg, var(--bg-deep), rgba(2, 20, 35, 0) 5%, rgba(2, 20, 35, 0) 95%, var(--bg-deep));
}

#status-art::after {
	bottom: -1px;
	height: calc(var(--s) * 140);
	background: linear-gradient(rgba(2, 20, 35, 0), var(--bg-deep));
}

/* Brilho do cristal (pulsa). */
#status-glow {
	left: calc(var(--s) * 164);
	top: calc(var(--s) * 150);
	width: calc(var(--s) * 440);
	height: calc(var(--s) * 440);
	border-radius: 50%;
	background: radial-gradient(closest-side, rgba(150, 250, 255, 0.5), rgba(47, 230, 242, 0.2) 45%, rgba(47, 230, 242, 0));
	animation: glow 2.4s ease-in-out infinite alternate;
}

/* Anéis de HUD girando devagar: círculo tracejado achatado (o pai achata, o ::before gira). */
.hud-ring {
	border-radius: 50%;
	pointer-events: none;
}

.hud-ring::before {
	content: "";
	position: absolute;
	inset: 0;
	box-sizing: border-box;
	border-radius: 50%;
	border: calc(var(--s) * 2.5) dashed rgba(120, 240, 255, 0.35);
	animation: spin 60s linear infinite;
}

#status-ring-a {
	left: calc(var(--s) * 124);
	top: calc(var(--s) * 80);
	width: calc(var(--s) * 520);
	height: calc(var(--s) * 520);
	transform: scaleY(0.36);
}

#status-ring-b {
	left: calc(var(--s) * 84);
	top: calc(var(--s) * 380);
	width: calc(var(--s) * 600);
	height: calc(var(--s) * 600);
	transform: scaleY(0.3);
}

#status-ring-b::before {
	border-color: rgba(120, 240, 255, 0.22);
	border-style: dotted;
	animation-duration: 90s;
	animation-direction: reverse;
}

/* Partículas piscando. */
.spark {
	width: calc(var(--s) * 7);
	height: calc(var(--s) * 7);
	min-width: 2px;
	min-height: 2px;
	border-radius: 50%;
	background: #BFFBFF;
	box-shadow: 0 0 calc(var(--s) * 10) var(--cyan);
	animation: twinkle 2.6s ease-in-out infinite alternate;
}

/* Título em texto (branco-ciano com brilho), na posição da referência. */
#status-title {
	left: 0;
	right: 0;
	top: calc(var(--s) * 895);
	margin: 0;
	text-align: center;
	font-size: calc(var(--s) * 132);
	font-weight: 800;
	line-height: 1;
	letter-spacing: 0.04em;
	color: var(--text-glow);
	text-shadow: 0 0 calc(var(--s) * 8) rgba(120, 245, 255, 0.95), 0 0 calc(var(--s) * 26) rgba(47, 210, 255, 0.7);
}

#status-title small {
	display: block;
	margin-bottom: calc(var(--s) * 12);
	font-size: calc(var(--s) * 74);
	letter-spacing: 0.05em;
}

/* Barra holográfica: contorno ciano fino, preenchimento em degradê com brilho e reflexo deslizando. */
#status-progress {
	left: calc(var(--s) * 137);
	top: calc(var(--s) * 1194);
	box-sizing: border-box;
	width: calc(var(--s) * 495);
	height: calc(var(--s) * 34);
	min-height: 12px;
	padding: calc(var(--s) * 5);
	border: max(1px, calc(var(--s) * 2.5)) solid var(--cyan-soft);
	border-radius: 999px;
	background: rgba(2, 20, 35, 0.6);
	box-shadow: 0 0 calc(var(--s) * 14) rgba(47, 220, 255, 0.45), inset 0 0 calc(var(--s) * 10) rgba(47, 220, 255, 0.25);
	overflow: hidden;
}

#status-progress-fill {
	position: relative;
	width: 0%;
	height: 100%;
	border-radius: 999px;
	overflow: hidden;
	background: linear-gradient(90deg, #0E7F9C, var(--cyan) 85%, #D8FFFF);
	box-shadow: 0 0 calc(var(--s) * 12) var(--cyan);
	transition: width 150ms ease-out;
}

#status-progress-fill::after {
	content: "";
	position: absolute;
	top: 0;
	bottom: 0;
	left: 0;
	width: 40%;
	background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0));
	animation: sheen 1.8s ease-in-out infinite;
}

#status-progress.indeterminate #status-progress-fill {
	width: 30%;
	animation: indeterminate 1.2s ease-in-out infinite;
}

#status-label {
	left: 0;
	right: 0;
	top: calc(var(--s) * 1244);
	text-align: center;
	font-size: max(14px, calc(var(--s) * 34));
	font-weight: 700;
	letter-spacing: 0.02em;
	color: var(--label);
	text-shadow: 0 0 calc(var(--s) * 10) rgba(47, 220, 255, 0.8);
}

/* Aviso de erro / sem WebGL 2: painel holográfico no lugar da barra. */
#status-notice {
	display: none;
	left: 50%;
	top: calc(var(--s) * 1150);
	box-sizing: border-box;
	width: min(92vw, 440px);
	margin-left: calc(min(92vw, 440px) / -2);
	padding: 16px 20px;
	border: 2px solid var(--cyan-soft);
	border-radius: 18px;
	background: rgba(2, 20, 35, 0.88);
	box-shadow: 0 0 14px rgba(47, 220, 255, 0.4), inset 0 0 0 1px var(--danger);
	font-size: 15px;
	font-weight: 600;
	line-height: 1.45;
	text-align: center;
}

@keyframes glow {
	from { opacity: 0.6; transform: scale(0.92); }
	to { opacity: 1; transform: scale(1.05); }
}

@keyframes spin {
	to { transform: rotate(360deg); }
}

@keyframes twinkle {
	from { opacity: 0.15; }
	to { opacity: 1; }
}

@keyframes sheen {
	from { transform: translateX(-120%); }
	to { transform: translateX(280%); }
}

@keyframes indeterminate {
	from { transform: translateX(-100%); }
	to { transform: translateX(340%); }
}

/* Logo do estúdio (T-170, decisão 44): preto puro por cima da splash, ~1,5 s. */
#brand {
	position: fixed;
	inset: 0;
	display: flex;
	justify-content: center;
	align-items: center;
	box-sizing: border-box;
	padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
	background: #000;
	z-index: 2;
	transition: opacity 250ms ease-in;
}

#brand img {
	display: block;
	width: min(60vw, 420px, 60vh);
	height: auto;
	opacity: 0;
	transition: opacity 200ms ease-out;
}

#brand.show img {
	opacity: 1;
}

#brand.fade {
	opacity: 0;
	pointer-events: none;
}

@media (prefers-reduced-motion: reduce) {
	#brand,
	#brand img {
		transition: none;
	}
	#status-glow,
	.hud-ring::before,
	.spark,
	#status-progress-fill::after {
		animation: none;
	}
	#status-progress.indeterminate #status-progress-fill {
		animation-duration: 3s;
	}
	#status {
		transition: none;
	}
}

		<!-- T-295: guarda os AudioContext criados pelo jogo em window.__anima_audio (o log lê estado e sampleRate). Antes do motor. -->
		<script>
(function () {
	var w = window;
	w.__anima_audio = [];
	['AudioContext', 'webkitAudioContext'].forEach(function (name) {
		var Orig = w[name];
		if (!Orig || Orig.__animaWrapped) { return; }
		var Wrapped = function () {
			var ctx = arguments.length ? new Orig(arguments[0]) : new Orig();
			try { w.__anima_audio.push(ctx); if (w.__anima_audio.length > 8) { w.__anima_audio.shift(); } } catch (e) {}
			return ctx;
		};
		Wrapped.prototype = Orig.prototype;
		Wrapped.__animaWrapped = true;
		try { w[name] = Wrapped; } catch (e) {}
	});
})();
		</script>

		<script>
// Cor da página e do theme-color juntos (T-172): o Safari pinta a faixa abaixo do web view (zona do
// indicador de início) com o fundo da página. Etapas: logo #000, splash #021423 (base da arte tecnológica),
// título #021423, partida #5A4A9A (bandeja), resultado #7C6BC9. O Godot chama via ScreenKit.set_page_color().
window.animaSetPageColor = function (color) {
	document.documentElement.style.setProperty('--page-bg', color);
	document.documentElement.style.backgroundColor = color;
	document.body.style.backgroundColor = color;
	const meta = document.querySelector('meta[name="theme-color"]');
	if (meta) {
		meta.setAttribute('content', color);
	}
};

// Logo do estúdio (T-170): fade-in 200 ms, ~1 s parado, fade-out 250 ms. Não atrasa o engine,
// que começa a carregar em paralelo. animaBrand.whenDone(cb) roda cb quando o logo sai (ou já saiu);
// animaBrand.stop() corta o logo na hora (erro).
window.animaBrand = (function () {
	const el = document.getElementById('brand');
	const img = document.getElementById('brand-logo');
	const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
	const FADE_IN = 200, HOLD = 1000, FADE_OUT = 250;
	const queue = [];
	let active = true;
	function end(instant) {
		if (!active) {
			return;
		}
		active = false;
		clearTimeout(timer);
		window.animaSetPageColor('#021423');
		if (instant || still) {
			el.remove();
		} else {
			el.classList.add('fade');
			setTimeout(() => el.remove(), FADE_OUT + 50);
		}
		queue.splice(0).forEach((cb) => cb());
	}
	const timer = setTimeout(() => end(false), (still ? 0 : FADE_IN) + HOLD);
	if (img.complete && img.naturalWidth === 0) {
		end(true);
	} else {
		img.addEventListener('error', () => end(true));
		requestAnimationFrame(() => el.classList.add('show'));
	}
	return {
		whenDone: (cb) => (active ? queue.push(cb) : cb()),
		stop: () => end(true),
	};
}());

// Bloqueio de gestos do Safari: pinça, duplo toque, rolagem e menu de contexto.
(function () {
	const block = (e) => e.preventDefault();
	['gesturestart', 'gesturechange', 'gestureend', 'contextmenu', 'dblclick'].forEach((type) => {
		document.addEventListener(type, block, { passive: false });
	});
	document.addEventListener('touchmove', (e) => {
		if (e.touches.length > 1 || e.target === document.body || e.target.id === 'canvas') {
			e.preventDefault();
		}
	}, { passive: false });
}());

// Altura da janela para o Godot (T-170, T-172; docs/ui.md §9.1). O Godot dimensiona o canvas por
// window.innerHeight. A altura é a da ÁREA VISÍVEL: o menor entre innerHeight e visualViewport.height
// (sem zoom). Nunca lvh nem screen.height: no Safari do iPhone o web view acaba antes da tela (log do dono:
// 768 de 812) e a faixa de baixo é do navegador. Sondas svh/dvh/lvh ficam só para o diagnóstico.
// Simulação para capturas (docs/debug.md): ?simih=768 limita o innerHeight nativo; ?simsafe=t,r,b,l fixa a
// safe area em px CSS.
(function () {
	const params = new URLSearchParams(location.search);
	const simIh = parseFloat(params.get('simih')) || 0;
	const simSafe = (params.get('simsafe') || '').split(',').map(parseFloat);
	if (simSafe.length === 4 && simSafe.every((v) => v >= 0)) {
		const st = document.getElementById('safe-area-probe').style;
		['top', 'right', 'bottom', 'left'].forEach((side, i) => st.setProperty('padding-' + side, simSafe[i] + 'px'));
	}
	const desc = Object.getOwnPropertyDescriptor(window, 'innerHeight')
		|| Object.getOwnPropertyDescriptor(Window.prototype, 'innerHeight');
	const canHook = !!(desc && desc.get && desc.configurable);
	const nativeHeight = () => {
		const h = canHook ? desc.get.call(window) : window.innerHeight;
		return simIh > 0 ? Math.min(h, simIh) : h;
	};
	// Altura da tela na orientação atual (o iOS não troca screen.width/height ao girar).
	const screenHeight = () => {
		const portrait = window.matchMedia ? window.matchMedia('(orientation: portrait)').matches
			: window.innerWidth <= nativeHeight();
		return portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
	};
	const appHeight = () => {
		const h = nativeHeight();
		const vv = window.visualViewport;
		if (vv && vv.height > 0 && Math.abs(vv.scale - 1) < 0.01 && vv.height < h - 1) {
			return Math.round(vv.height);
		}
		return h;
	};
	window.animaNativeInnerHeight = nativeHeight;
	window.animaScreenHeight = screenHeight;
	if (canHook) {
		try {
			Object.defineProperty(window, 'innerHeight', { configurable: true, get: appHeight });
		} catch (e) {
			// Sem override: segue com a altura nativa.
		}
	}
	// A barra do Safari pode mudar o visualViewport sem 'resize' na janela: avisa o Godot.
	let last = appHeight();
	const sync = () => {
		const h = appHeight();
		if (h !== last) {
			last = h;
			window.dispatchEvent(new Event('resize'));
		}
	};
	if (window.visualViewport) {
		window.visualViewport.addEventListener('resize', sync);
	}
	window.addEventListener('orientationchange', () => setTimeout(sync, 250));
}());

// Safe area em px CSS, para o Godot ler via JavaScriptBridge.eval("animaGetSafeArea()") (docs/ui.md §9).
// covers_bottom: o canvas chega à borda inferior da tela (bottom ≥ altura da tela − 1). Sem isso, o Godot
// zera a inset inferior (a faixa fora do canvas já é a zona do indicador de início).
window.animaGetSafeArea = function () {
	const s = getComputedStyle(document.getElementById('safe-area-probe'));
	const canvas = document.getElementById('canvas');
	const r = canvas ? canvas.getBoundingClientRect() : null;
	const bottom = r && r.height > 0 ? r.bottom : window.innerHeight;
	return JSON.stringify({
		top: parseFloat(s.paddingTop) || 0,
		right: parseFloat(s.paddingRight) || 0,
		bottom: parseFloat(s.paddingBottom) || 0,
		left: parseFloat(s.paddingLeft) || 0,
		width: window.innerWidth,
		height: window.innerHeight,
		covers_bottom: bottom >= window.animaScreenHeight() - 1,
	});
};

// Diagnóstico do viewport (T-172): cabeçalho do log e overlay ?debug=1 usam estes mesmos números.
window.animaViewportInfo = function () {
	const vv = window.visualViewport;
	const canvas = document.getElementById('canvas');
	const r = canvas ? canvas.getBoundingClientRect() : { top: 0, bottom: 0, height: 0 };
	const ph = (id) => Math.round(document.getElementById(id).getBoundingClientRect().height);
	const round = (v) => Math.round(v * 10) / 10;
	return JSON.stringify({
		inner: [window.innerWidth, window.animaNativeInnerHeight()],
		app_h: window.innerHeight,
		outer_h: window.outerHeight,
		vv: vv ? [round(vv.width), round(vv.height), round(vv.offsetTop), round(vv.scale)] : null,
		client_h: document.documentElement.clientHeight,
		screen: [screen.width, screen.height],
		svh: ph('probe-svh'),
		dvh: ph('probe-dvh'),
		lvh: ph('probe-lvh'),
		canvas: [round(r.top), round(r.bottom), round(r.height)],
		canvas_h: canvas ? parseFloat(canvas.style.height) || 0 : 0,
		standalone: !!((window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone),
		safe: JSON.parse(window.animaGetSafeArea()),
	});
};
		</script>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusFill = document.getElementById('status-progress-fill');
	const statusLabel = document.getElementById('status-label');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			// Fade curto sobre o primeiro quadro do jogo; remove o overlay ao final.
			initializing = false;
			requestAnimationFrame(() => {
				statusOverlay.classList.add('fade');
				setTimeout(() => statusOverlay.remove(), 300);
			});
			return;
		}
		const isProgress = mode === 'progress';
		statusProgress.style.display = isProgress ? 'block' : 'none';
		statusLabel.style.display = isProgress ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		text.split('\n').forEach((line, i) => {
			if (i > 0) {
				statusNotice.appendChild(document.createElement('br'));
			}
			statusNotice.appendChild(document.createTextNode(line));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		window.animaBrand.stop();
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('Ocorreu um erro desconhecido.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		displayFailureNotice('Seu navegador não tem os recursos necessários para rodar o jogo:\n' + missing.join('\n'));
		return;
	}

	setStatusMode('progress');
	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				statusProgress.classList.remove('indeterminate');
				const pct = Math.min(100, Math.round((current / total) * 100));
				statusFill.style.width = pct + '%';
				statusLabel.textContent = 'Carregando… ' + pct + '%';
			} else {
				statusProgress.classList.add('indeterminate');
			}
		},
	}).then(() => {
		// Jogo pronto antes do logo acabar: o logo termina antes de revelar o título.
		window.animaBrand.whenDone(() => setStatusMode('hidden'));
	}, displayFailureNotice);
}());
		</script>
