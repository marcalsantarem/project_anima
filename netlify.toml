# Netlify: o jogo web é publicado pelo GitHub Actions (build/web); aqui só as funções e o redirect da API de logs.
# Não há comando de build: o deploy usa --no-build.

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# A rota /api/log vem do `config.path` da função (netlify/functions/log.mjs). Não crie um redirect para
# /.netlify/functions/log: a função com path próprio não existe nessa URL e o redirect (force) vira 404.
